{% load static %}
<header>
    <div class="nav-container">
        <a href="{% url 'expenses:list' %}" class="brand">Expense Tracker</a>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'expenses:list' %}">Мои расходы</a>
                <a href="{% url 'expenses:create' %}" class="btn btn-primary" style="padding: 4px 12px; color: white;">+ Добавить расход</a>
                <span style="color: #57606a; margin-left: 8px;">Вы вошли как: <strong>{{ user.username }}</strong></span>
                <a href="{% url 'accounts:logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'accounts:login' %}">Войти</a>
                <a href="{% url 'accounts:register' %}" class="btn btn-primary" style="padding: 4px 12px; color: white;">Регистрация</a>
            {% endif %}
        </nav>
    </div>
</header>
