{% extends "base.html" %}

{% block title %}Удалить предложение — SkillSwap{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto;" class="card">
    <h2 style="color: #cf222e; margin-bottom: 16px;">Удаление предложения</h2>
    <p>Вы уверены, что хотите безвозвратно удалить предложение: <strong>«{{ offer.title }}»</strong>?</p>

    <form method="post" style="margin-top: 24px; display: flex; gap: 10px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'offers:offer_detail' offer_id=offer.id %}" class="btn btn-outline">Отмена</a>
    </form>
</div>
{% endblock %}
